<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Pocket - Sign In</title>
    <script>
        (function() {
            var theme = localStorage.getItem('tcg-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
        .login-card { width: 100%; max-width: 440px; background: var(--bg-surface-card); border: 1px solid var(--border-subtle); border-radius: 18px; padding: 2rem; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35); backdrop-filter: blur(12px); }
        .login-brand { display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin-bottom: 1.25rem; color: var(--text-pure); font-weight: 800; text-decoration: none; }
        .login-title { text-align: center; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .login-sub { text-align: center; color: var(--text-secondary); font-size: 0.9rem; margin: 0.25rem 0 1.5rem; }
        .role-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; background: var(--bg-surface-muted); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 0.3rem; margin-bottom: 1.5rem; }
        .role-tab { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.6rem; border: none; border-radius: 9px; background: transparent; color: var(--text-secondary); font-family: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; }
        .role-tab.active { background: linear-gradient(135deg, var(--accent-blue), #1d4ed8); color: #fff; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3); }
        .field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .field label { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .field .input-field { width: 100%; }
        .login-error { background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.35); color: var(--accent-ruby); border-radius: 10px; padding: 0.65rem 0.9rem; font-size: 0.88rem; margin-bottom: 1rem; }
        .login-hint { text-align: center; color: var(--text-muted); font-size: 0.82rem; margin-top: 1.25rem; }
        .login-hint a { color: var(--accent-cyan); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="login-card">
            <a th:href="@{/}" class="login-brand">
                <span th:replace="~{fragments/icons :: pokeball('icon-md')}"></span>
                <span>Pokémon TCG Pocket Vault</span>
            </a>

            <h1 class="login-title">Welcome back</h1>
            <p class="login-sub" id="loginSubtitle">Sign in to browse cards and track your orders</p>

            <div class="role-switch" role="tablist" aria-label="Account type">
                <button type="button" class="role-tab active" id="tabCustomer" role="tab" aria-selected="true" onclick="selectRole('CUSTOMER')">
                    <span th:replace="~{fragments/icons :: users('icon-sm')}"></span>
                    <span>Customer</span>
                </button>
                <button type="button" class="role-tab" id="tabManager" role="tab" aria-selected="false" onclick="selectRole('MANAGER')">
                    <span th:replace="~{fragments/icons :: package('icon-sm')}"></span>
                    <span>Manager</span>
                </button>
            </div>

            <div class="login-error" th:if="${param.error}" role="alert">
                Invalid username or password. Please try again.
            </div>
            <div class="login-error" th:if="${param.denied}" role="alert">
                This account does not have access to the selected portal.
            </div>

            <form th:action="@{/login}" method="post" id="loginForm" autocomplete="on">
                <input type="hidden" name="portal" id="portalInput" value="CUSTOMER">

                <div class="field">
                    <label for="username">Username</label>
                    <input class="input-field" type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input class="input-field" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    <span id="submitLabel">Sign in as Customer</span>
                </button>
            </form>

            <p class="login-hint">
                <a th:href="@{/}">Continue browsing as guest</a>
            </p>
        </section>
    </main>

    <script>
        var ROLE_COPY = {
            CUSTOMER: { subtitle: 'Sign in to browse cards and track your orders', submit: 'Sign in as Customer' },
            MANAGER: { subtitle: 'Sign in to manage inventory, accounts and orders', submit: 'Sign in as Manager' }
        };

        function selectRole(role) {
            document.getElementById('portalInput').value = role;
            document.getElementById('tabCustomer').classList.toggle('active', role === 'CUSTOMER');
            document.getElementById('tabManager').classList.toggle('active', role === 'MANAGER');
            document.getElementById('tabCustomer').setAttribute('aria-selected', role === 'CUSTOMER');
            document.getElementById('tabManager').setAttribute('aria-selected', role === 'MANAGER');
            document.getElementById('loginSubtitle').textContent = ROLE_COPY[role].subtitle;
            document.getElementById('submitLabel').textContent = ROLE_COPY[role].submit;
        }

        // Allow deep-linking, e.g. /login?portal=manager
        (function() {
            var portal = new URLSearchParams(window.location.search).get('portal');
            if (portal && portal.toUpperCase() === 'MANAGER') {
                selectRole('MANAGER');
            }
        })();
    </script>
</body>
</html>
