<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Unified Element Dispatcher (Guarantees exactly one icon, preventing overlap) -->
    <th:block th:fragment="elementIcon(type, className)">
        <!-- th:replace outranks th:case on the same tag, so each case needs its own wrapper -->
        <th:block th:switch="${type}">
            <th:block th:case="'FIRE'"><div th:replace="~{fragments/icons :: fire(${className})}"></div></th:block>
            <th:block th:case="'WATER'"><div th:replace="~{fragments/icons :: water(${className})}"></div></th:block>
            <th:block th:case="'LIGHTNING'"><div th:replace="~{fragments/icons :: lightning(${className})}"></div></th:block>
            <th:block th:case="'PSYCHIC'"><div th:replace="~{fragments/icons :: psychic(${className})}"></div></th:block>
            <th:block th:case="'GRASS'"><div th:replace="~{fragments/icons :: grass(${className})}"></div></th:block>
            <th:block th:case="*"><div th:replace="~{fragments/icons :: star(${className})}"></div></th:block>
        </th:block>
    </th:block>

    <!-- Reusable Vector SVG Icons (Zero Emojis) -->
    <div th:fragment="pokeball(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke="currentColor" fill="none"/>
            <path d="M2 12h7" stroke="currentColor"/>
            <path d="M15 12h7" stroke="currentColor"/>
            <circle cx="12" cy="12" r="3" fill="currentColor" stroke="currentColor"/>
            <circle cx="12" cy="12" r="1" fill="#060810"/>
        </svg>
    </div>

    <div th:fragment="fire(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="currentColor" fill-opacity="0.2"/>
        </svg>
    </div>

    <div th:fragment="water(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" fill="currentColor" fill-opacity="0.2"/>
        </svg>
    </div>

    <div th:fragment="lightning(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor" fill-opacity="0.2"/>
        </svg>
    </div>

    <div th:fragment="psychic(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <path d="M12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10A10 10 0 0 1 2 12 10 10 0 0 1 12 2" stroke-dasharray="4 2"/>
            <path d="M12 6a6 6 0 0 1 6 6 6 6 0 0 1-6 6 6 6 0 0 1-6-6 6 6 0 0 1 6-6"/>
        </svg>
    </div>

    <div th:fragment="grass(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" fill="currentColor" fill-opacity="0.2"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
    </div>

    <div th:fragment="star(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor" fill-opacity="0.2"/>
        </svg>
    </div>

    <div th:fragment="dashboard(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="9" x="3" y="3" rx="1"/>
            <rect width="7" height="5" x="14" y="3" rx="1"/>
            <rect width="7" height="9" x="14" y="12" rx="1"/>
            <rect width="7" height="5" x="3" y="16" rx="1"/>
        </svg>
    </div>

    <div th:fragment="layers(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
        </svg>
    </div>

    <div th:fragment="package(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16.5 9.4 7.55 4.24"/>
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.29 7 12 12 20.71 7"/>
            <line x1="12" x2="12" y1="22" y2="12"/>
        </svg>
    </div>

    <div th:fragment="receipt(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/>
            <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
            <path d="M12 17.5v.5"/>
            <path d="M12 6v.5"/>
        </svg>
    </div>

    <div th:fragment="externalLink(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6"/>
            <path d="M10 14 21 3"/>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        </svg>
    </div>

    <div th:fragment="alertTriangle(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <line x1="12" x2="12" y1="9" y2="13"/>
            <line x1="12" x2="12.01" y1="17" y2="17"/>
        </svg>
    </div>

    <div th:fragment="search(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
        </svg>
    </div>

    <div th:fragment="filter(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
    </div>

    <div th:fragment="creditCard(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="5" rx="2"/>
            <line x1="2" x2="22" y1="10" y2="10"/>
        </svg>
    </div>

    <div th:fragment="truck(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/>
            <path d="M15 18H9"/>
            <path d="M19 18h2a1 1 0 0 0 1-1v-5l-4-4h-3"/>
            <circle cx="7" cy="18" r="2"/>
            <circle cx="17" cy="18" r="2"/>
        </svg>
    </div>

    <div th:fragment="checkCircle(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
    </div>

    <div th:fragment="xCircle(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="m15 9-6 6"/>
            <path d="m9 9 6 6"/>
        </svg>
    </div>

    <div th:fragment="eye(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </div>

    <div th:fragment="plus(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" x2="12" y1="5" y2="19"/>
            <line x1="5" x2="19" y1="12" y2="12"/>
        </svg>
    </div>

    <div th:fragment="minus(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" x2="19" y1="12" y2="12"/>
        </svg>
    </div>

    <div th:fragment="sun(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
        </svg>
    </div>

    <div th:fragment="moon(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
    </div>

    <div th:fragment="flip(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 12 4-4v3h10V8l4 4-4 4v-3H7v3z"/>
            <path d="M12 2v3"/>
            <path d="M12 19v3"/>
        </svg>
    </div>

    <div th:fragment="users(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
    </div>

    <div th:fragment="copy(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
    </div>

    <div th:fragment="pencil(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
    </div>

    <div th:fragment="sparkles(className)" th:class="${className != null ? className : 'icon-svg'}" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
        </svg>
    </div>

</body>
</html>
